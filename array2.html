<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>

<body>

   <!-- Student List -->
   <h5 id="res"></h5>
   <button onclick="test()"> Std List</button>
   <button onclick="hide()">Hide </button>
</body>


<script>

   function test() {
      let list = ["Ihsan", "Danihs", "Khan", "Bangash", "sami"];
      let Result = ''
      for (i = 0; i <= list.length; i++) {
         Result += list[i] + "<br/>"
      }
      document.getElementById('res').innerHTML = Result
   }


    function hide(){
      document.getElementById('res').innerHTML = ''
      
    }
</script>

</html>
