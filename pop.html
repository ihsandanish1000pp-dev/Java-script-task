<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Pop Method</h1>


    <h4 id="res"></h4>
    <button onclick="addMouse()">Add mouse</button>
    <button onclick="addKeyborad()">Add keyborad</button>
    <button onclick="addLaptop()">Add laptop</button>
    <button onclick="RemoveItem()">Remove Item</button>
</body>

<script>


    let list = [];
    function addMouse() {

        list.push({
            Name: 'mouse',
            price: 1200,
        })

        showcart()
    }


    function addKeyborad() {

        list.push({
            Name: 'KeyBorad',
            price: 2300
        })

        showcart()
    }


    function addLaptop() {
        list.push({
            Name: 'Laptop',
            price: 23000,
        })

        showcart()
    }



    function RemoveItem() {

        list.pop();
        showcart();
    }


    function showcart() {
        let res = "";


        for(let i = 0; i < list.length; i++) {

            res +=
                "Name:" + list[i].Name + "</br>" +
                "price" + list[i].price + "<hr>" 
         }
         document.getElementById('res').innerHTML = res;
    }

</script>

</html>
