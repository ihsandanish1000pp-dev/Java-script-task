    <button onclick="show()">Show list</button>

<script>
    function show() {
        let list = ['Ihsan ', ' Danihs', ' Aman Ullah', ' Rehmat ullah',];
        let result = ''
        for (let i = 0; i < list.length; i++) {
            result += list[i];
        }

        document.getElementsByClassName('res')[0].innerHTML = result;
    }
</script>


<script>

    function showProduct() {
        let prod = ['Shose', ' Shirt', ' watch', 'bag'];
        let result = ''

        for (i = 0; i <= prod.length; i++) {
            result += prod[i]
        }

        document.getElementsByClassName('resd')[0].innerHTML = result
    }

    function hideProduct() {
        document.getElementsByClassName('resd')[0].innerHTML = '';
    }



</script>
