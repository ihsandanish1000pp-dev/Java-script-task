<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #yellow {
            width: 400px;
            height: 400px;
            background-color: yellow;
            position: relative;
        }

        #red {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
        }
    </style>
</head>

<body>
    <!-- Anmition Box -->

    <button onclick="move()">Click Me</button>
    <div id="yellow">
        <div id="red"></div>
    </div>

</body>


<script>
    function move() {
        var redelem = document.getElementById('red');
        var poe = 0;
        var anim = setInterval(animate,5)

        function animation(){
            poe++;
            redelem.style.top = poe+'px';
        }
    }
</script>

</html>
