
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <h6>Try and catch</h6>
        <button onclick="test()">Click Me</button>
        <h6 id="res"></h6>
</body>



    <script>
           
             function test(){
                try{
                    alert('Hello');
                } catch(err){

                     document.getElementById('res').innerHTML= err
                }
             }
    </script>
</html>
