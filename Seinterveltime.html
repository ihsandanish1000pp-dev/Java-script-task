<!DOCTYPE html>
<html lang="en">

<head>

<body>

    <h1>Set Intervel Time offer </h1>



    <div id="res"></div>
</body>


<script>
    //  let count = 0;

    //  setInterval(function(){
    //     count++;
    //     document.getElementById('res').innerHTML = count
    //  },1000)




    let time = 10;
    let timer = setInterval(function () {
        time--;
        document.getElementById('res').innerHTML = time + " Seconds";


        if (time === 0) {
            clearInterval(timer);
            document.getElementById('res').innerHTML = "Offer Expired"
        }
    }, 1000)
</script>

</html>
