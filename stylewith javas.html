
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
         #main{

             color: red;
             transition: 2s;
             text-align: center;
         }
    </style>
</head>
<body>
    
      <div id="main" onmouseenter="modify()" onmouseleave="unmodify()">Hello Every One...</div>
</body>


   <script>
        function modify(){

             document.getElementById('main').style.fontSize = '100px'
             document.getElementById('main').style.color =  'blue'
             document.getElementById('main').style.background = 'gray'
        }

        function unmodify(){
            document.getElementById('main').style.fontSize= '50px'
            document.getElementById('main').style.color ='blue'
            document.getElementById('main').style.background= ''
        }
   </script>
</html>
