<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Form Validition</h1>

    <input type="text" name="name" onkeyup="(val(this))">
    <br>
      <div id="res"></div>
</body>

<script>

    document.getElementById('res').style.color = 'red';
    function val(elem) {
        if (isNaN(elem.value)) {
            document.getElementById('res').innerText = "Please Enter a Number";
        } else {
            document.getElementById('res').innerText = '';
            if (elem.value.length > 10) {
                document.getElementById('res').innerText = 'please Enter only 10 digits'
            } else {
                document.getElementById('res').innerText = ''
            }
        }
    }
</script>

</html>
