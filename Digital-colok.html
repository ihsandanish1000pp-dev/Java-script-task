<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {

            text-align: center;
            font-weight: 900;
            color: orange;
            font-size: 50px;
        }
    </style>
</head>

<body onload="showTime()">

    <!-- <h3>Digital Clock</h1> -->
    <h1></h1>
</body>

<script>
    function showTime() {

        var d = new Date;
        var h = d.getHours();
        var m = d.getMinutes();
        var s = d.getSeconds();
        var session = 'Am';

        if (h >= 12) {
            session = 'pm';
        }

        if (h >= 12) {
            h = h - 12;
        }
        var time = h + " : " + m + " : " + s + " : " + session;
        document.getElementsByTagName('h1')[0].innerText = time;
        setTimeout(showTime, 1000)
    }

</script>

</html>
