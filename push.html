<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>PUSH MEthod</h1>

    <h5 id="res"></h5>
    <button onclick="AddCart()">Add Cart</button>
    <button onclick="HideList()">Hide List</button>
</body>


<script>

    let cart = []
    function AddCart() {
        cart.push({
            Name: 'khumar',
            price: 3000,
            quninty: 1
        })

        document.getElementById('res').innerHTML =
            cart[0].Name + "<br>" +
            cart[0].price + "<br" +
            cart[0].quninty;
    }


    function HideList(){
        document.getElementById('res').innerHTML= '';
    }
</script>

</html>
