<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <h1>For loop</h1>
  <h4 id="res"></h4>
  <button onclick="list()">Product List </button>
</body>


<script>
  function list() {
    let product = ['Laptop', "Mouse", "Keybord", "Screen", 'SSD'];
    let Result = ''

    for (let i = 0; i < product.length; i++) {
      Result += product[i] + "<br/>"


      if (product[i] === 'Mouse') {
        console.log('Mouse is Avliable')
      }
    }

    document.getElementById('res').innerHTML = Result;
  }
</script>

</html>
